<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spending History | ExpenSafe</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="dashboard-page"><header class="dash-header"><a class="dash-brand" href="{{ url_for('home') }}">₹ ExpenSafe</a><a class="logout-link" href="{{ url_for('home') }}">← Home</a></header>
<main class="home-container"><h1>Spending History</h1><p>Your recorded transactions, newest first.</p><section class="panel"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th></tr></thead><tbody>{% for tx in transactions %}<tr><td>{{ tx.date }}</td><td>{{ tx.merchant }}</td><td>{{ tx.category }}</td><td>₹{{ "%.2f"|format(tx.amount) }}</td></tr>{% else %}<tr><td colspan="4">No spending recorded yet. Add your first transaction!</td></tr>{% endfor %}</tbody></table></div></section></main></body></html>
